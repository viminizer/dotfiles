# Code readability overrides, layered on top of Purple-Custom.conf.
# Include this AFTER the Purple-Custom include so these win.
#
# Claude Code's `dark-ansi` theme maps syntax scopes onto ANSI slots:
#   color8  -> comments, annotations (@Override), decorators
#   color10 -> strings, regex literals
#   color11 -> function names, class names, titles
#   color12 -> numbers, literals (true/false/null)
#   color13 -> keywords (if/return/for), operators
#   color14 -> const/let/class/def, built-ins, type names
#
# These six are the only slots syntax highlighting touches. No purple in any
# of them - the Purple-Custom original put three shades of purple on 12/13/14,
# which made every file read as one color.

# Comments and annotations. Neutral grey, no violet cast, still legible on
# the #050014 background (the original #4c1d95 was not).
color8                #7d8590

# Strings and regex literals.
color10               #4ade80

# Function names, class names, titles.
color11               #fcd34d

# Numbers and literals: 100, 3.14, true, false, null, nil.
# Orange rather than the old #b794f6 purple.
color12               #fb923c

# Keywords and operators: if, return, for, throw, =, +
color13               #f92672

# const/let/class/def/func/async, built-ins, and type names: String, int.
color14               #67e8f9
