# ===== New Machine Setup =====
# 1. brew install --cask kitty
# 2. brew install tmux neovim glow bat git-delta gum eza
# 3. Nerd font from the Brewfile; Osaka needs activating by hand, see below.
# 4. Ensure ~/.config/kitty/themes contains Argonaut.conf.
# 5. Start a login shell so the zsh display helpers and aliases are loaded.
#    This setup improves `ls`, `cat`, `diff`, `man`, and markdown rendering.
#
# ===== Theme =====
include ./themes/Argonaut.conf
# Overrides color8/10/11 for readable comments, green strings, gold function
# names. Must stay after Purple-Custom. Delete this line to revert.
# include ./themes/Code-Readability.conf

# ===== Font ======
# Maple Mono NF includes Nerd Font icons for the terminal prompt.
# Previous setup: font_family Osaka-Mono, font_size 18.
font_family Maple Mono NF
font_size 16
modify_font cell_width 100%

# ===== Cursor =====
cursor_shape underline
cursor_blink_interval -1
# The cursor slides to its new position instead of teleporting. Costs nothing
# and makes long jumps much easier to follow.
#
# The number is a stillness threshold, not a speed: the trail is only drawn if
# the cursor sat where it was for longer than this many milliseconds. At 3 that
# is every move, held keys included, and the slide then fights the key repeat --
# the cursor is already eight lines further down while the drawn one is still
# gliding toward where it was. That reads as a slow cursor, and it gets *worse*
# as key repeat gets faster, because more lines fit inside one animation.
#
# 50 is above the 15ms repeat interval set by install.sh, so holding j never
# trails, while a deliberate jump after any pause still does. Set to 0 to turn
# the effect off entirely; drop cursor_trail_decay if the slide itself is slow.
cursor_trail 50
cursor_trail_decay 0.1 0.4

# ===== Window =====
hide_window_decorations titlebar-only
window_padding_width 8 8 8 8
background_opacity 0.9
background_blur 0
confirm_os_window_close 0

# ===== Scrollback =====
scrollback_lines 10000
scrollback_pager_history_size 10

# ===== Bell =====
enable_audio_bell no

# ===== Mouse =====
mouse_hide_wait 3.0

# ===== URLs =====
detect_urls yes
url_style curly
open_url_with default

# ===== Clipboard =====
copy_on_select clipboard
strip_trailing_spaces smart

# ===== Shell =====
shell zsh --login -c "if command -v tmux >/dev/null 2>&1; then tmux attach || tmux; else zsh; fi"
shell_integration enabled

# ===== Editor =====
env EDITOR=nvim
editor nvim

# ===== macOS =====
macos_option_as_alt yes
macos_quit_when_last_window_closed yes

# ===== Session Restore =====
startup_session last-session.kitty-session

# ===== Tab Bar =====
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground   #000001
active_tab_background   #ff000f
inactive_tab_foreground #444444
inactive_tab_background #222222

# ===== Keymaps =====
map cmd+t combine : new_tab : save_as_session --save-only ~/.config/kitty/last-session.kitty-session
map cmd+w combine : close_tab : save_as_session --save-only ~/.config/kitty/last-session.kitty-session
map cmd+q combine : save_as_session --save-only ~/.config/kitty/last-session.kitty-session : quit

# Send tmux prefix (Ctrl+f) followed by p/n to switch windows without pressing prefix.
map ctrl+, send_text all \x06p
map ctrl+. send_text all \x06n
# map shift+cmd+i combine : set_tab_title : save_as_session --save-only ~/.config/kitty/last-session.kitty-session

# ===== Remote Control =====
allow_remote_control socket-only
listen_on unix:/tmp/kitty
