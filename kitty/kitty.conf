# ===== New Machine Setup =====
# 1. brew install --cask kitty
# 2. brew install tmux neovim glow bat git-delta gum eza
# 3. Install JetBrains Mono so kitty can use the configured font family.
# 4. Ensure ~/.config/kitty/kitty-themes contains Purple-Custom.conf.
# 5. Start a login shell so the zsh display helpers and aliases are loaded.
#    This setup improves `ls`, `cat`, `diff`, `man`, and markdown rendering.
#
# ===== Theme =====
include ./kitty-themes/themes/Purple-Custom.conf

# ===== Font ======
font_family JetBrains Mono SemiBold
# font_family Osaka
font_size 16
modify_font cell_width 95%
macos_thicken_font 0.25

# ===== Cursor =====
cursor_shape underline
cursor_blink_interval -1

# ===== Window =====
hide_window_decorations titlebar-only
window_padding_width 10 10 10 10
background_opacity 0.7
background_blur 10
confirm_os_window_close 0

# ===== Scrollback =====
scrollback_lines 10000
scrollback_pager_history_size 10

# ===== Bell =====
enable_audio_bell no

# ===== Mouse =====
mouse_hide_wait 3.0

# ===== URLs =====
detect_urls yes
url_style curly
open_url_with default

# ===== Clipboard =====
copy_on_select clipboard
strip_trailing_spaces smart

# ===== Shell =====
shell zsh --login -c "if command -v tmux >/dev/null 2>&1; then tmux attach || tmux; else zsh; fi"
shell_integration enabled

# ===== Editor =====
env EDITOR=/opt/homebrew/bin/nvim
editor /opt/homebrew/bin/nvim

# ===== macOS =====
macos_option_as_alt yes
macos_quit_when_last_window_closed yes

# ===== Session Restore =====
startup_session /Users/mac/.config/kitty/last-session.kitty-session

# ===== Tab Bar =====
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground   #050014
active_tab_background   #a78bfa
inactive_tab_foreground #736d7c
inactive_tab_background #2e1065

# ===== Keymaps =====
map cmd+t combine : new_tab : save_as_session --save-only /Users/mac/.config/kitty/last-session.kitty-session
map cmd+w combine : close_tab : save_as_session --save-only /Users/mac/.config/kitty/last-session.kitty-session
map cmd+q combine : save_as_session --save-only /Users/mac/.config/kitty/last-session.kitty-session : quit

# Send tmux prefix (Ctrl+f) followed by p/n to switch windows without pressing prefix.
map ctrl+, send_text all \x06p
map ctrl+. send_text all \x06n
map shift+cmd+i combine : set_tab_title : save_as_session --save-only /Users/mac/.config/kitty/last-session.kitty-session

# ===== Remote Control =====
allow_remote_control socket-only
listen_on unix:/tmp/kitty
