# ===== New Machine Setup =====
# 1. brew install --cask kitty
# 2. brew install tmux neovim glow bat git-delta gum eza
# 3. No font install needed. Osaka ships with macOS.
# 4. Ensure ~/.config/kitty/themes contains Argonaut.conf.
# 5. Start a login shell so the zsh display helpers and aliases are loaded.
#    This setup improves `ls`, `cat`, `diff`, `man`, and markdown rendering.
#
# ===== Theme =====
include ./themes/Argonaut.conf
# Overrides color8/10/11 for readable comments, green strings, gold function
# names. Must stay after Purple-Custom. Delete this line to revert.
# include ./themes/Code-Readability.conf

# ===== Font ======
# Osaka, Apple's classic Japanese face. The thinnest monospace on the machine,
# which is the point: weight was previously compensating for a low-contrast
# palette, and once the contrast and syntax floors did that job a heavy face
# just read as fat.
#
# Size 18, not 16. Osaka's glyphs sit small in the em, so it renders noticeably
# smaller than JetBrains Mono at the same point size.
#
# cell_width is 100%, not 95%. The 5% shave was tuned for JetBrains Mono, a
# wide face where it bought columns for free. Osaka is already narrow, so the
# same setting compressed an already tight font.
#
# Carries real CJK coverage, so Japanese renders in-family instead of falling
# back. Nerd Font icons still come from a fallback: Hack Nerd Font Mono.
font_family Osaka
font_size 18
modify_font cell_width 100%

# ===== Cursor =====
cursor_shape underline
cursor_blink_interval -1
# The cursor slides to its new position instead of teleporting. Costs nothing
# and makes long jumps much easier to follow.
cursor_trail 3
cursor_trail_decay 0.1 0.4

# ===== Window =====
hide_window_decorations titlebar-only
window_padding_width 8 8 8 8
background_opacity 0.9
background_blur 0
confirm_os_window_close 0

# ===== Scrollback =====
scrollback_lines 10000
scrollback_pager_history_size 10

# ===== Bell =====
enable_audio_bell no

# ===== Mouse =====
mouse_hide_wait 3.0

# ===== URLs =====
detect_urls yes
url_style curly
open_url_with default

# ===== Clipboard =====
copy_on_select clipboard
strip_trailing_spaces smart

# ===== Shell =====
shell zsh --login -c "if command -v tmux >/dev/null 2>&1; then tmux attach || tmux; else zsh; fi"
shell_integration enabled

# ===== Editor =====
env EDITOR=nvim
editor nvim

# ===== macOS =====
macos_option_as_alt yes
macos_quit_when_last_window_closed yes

# ===== Session Restore =====
startup_session last-session.kitty-session

# ===== Tab Bar =====
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground   #000001
active_tab_background   #ff000f
inactive_tab_foreground #444444
inactive_tab_background #222222

# ===== Keymaps =====
map cmd+t combine : new_tab : save_as_session --save-only ~/.config/kitty/last-session.kitty-session
map cmd+w combine : close_tab : save_as_session --save-only ~/.config/kitty/last-session.kitty-session
map cmd+q combine : save_as_session --save-only ~/.config/kitty/last-session.kitty-session : quit

# Send tmux prefix (Ctrl+f) followed by p/n to switch windows without pressing prefix.
map ctrl+, send_text all \x06p
map ctrl+. send_text all \x06n
# map shift+cmd+i combine : set_tab_title : save_as_session --save-only ~/.config/kitty/last-session.kitty-session

# ===== Remote Control =====
allow_remote_control socket-only
listen_on unix:/tmp/kitty
